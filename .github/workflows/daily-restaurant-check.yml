name: Daily restaurant check
# Every day at 9am New Orleans time, reads each restaurant's OWN website and updates src/deals.json:
# oyster dishes and prices, happy hour, hours and address. A value is only saved when its exact
# wording is on the restaurant's page. The site redeploys itself after a change.
# The run's report (what changed, with proof links) is on the run page and in data/last-check.md.

on:
  schedule:
    # GitHub schedules in UTC only. 9am New Orleans is 14:00 UTC in summer and 15:00 UTC in winter,
    # so both are listed and the first step keeps the right one for today.
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      venues:
        description: "Only these restaurant ids, separated by spaces (blank = all)"
        required: false
        default: ""
      dry_run:
        description: "Report only, change nothing"
        type: boolean
        default: false
  push:
    # Trial run whenever the robot itself changes (report only unless on main).
    paths:
      - "scripts/check-restaurants.mjs"
      - "scripts/restaurant-check/**"
      - ".github/workflows/daily-restaurant-check.yml"

permissions:
  contents: write # save updated data
  actions: write # redeploy the site
  models: read # free GitHub Models, used when no ANTHROPIC_API_KEY secret is set

concurrency:
  group: daily-restaurant-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Is it 9am in New Orleans?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node --input-type=module -e "
            import { isNineInNewOrleans } from './scripts/restaurant-check/lib.mjs'
            const ok = isNineInNewOrleans('${{ github.event.schedule }}')
            console.log(ok ? 'Yes, running.' : 'Not 9am in New Orleans on this schedule today, skipping.')
            await import('node:fs').then(fs => fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run=' + ok + '\n'))
          "

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
        with:
          version: "10"

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache browser
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the robot's safety rules
        if: steps.gate.outputs.run == 'true'
        run: node --test scripts/restaurant-check/lib.test.mjs scripts/restaurant-check/pages.test.mjs

      - name: Read every restaurant's website
        if: steps.gate.outputs.run == 'true'
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY: ${{ (github.ref != 'refs/heads/main' || inputs.dry_run) && '--dry-run' || '' }}
          VENUES: ${{ inputs.venues }}
        run: node scripts/check-restaurants.mjs $DRY $(echo "$VENUES" | tr -cd 'a-z0-9 -')

      - name: Map any new addresses
        if: steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run
        run: node scripts/refresh-data.mjs

      - name: Validate data
        if: steps.gate.outputs.run == 'true'
        run: pnpm test

      - name: Save
        if: steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run
        id: save
        run: |
          if git diff --quiet src/deals.json data/; then echo "Nothing to save."; exit 0; fi
          git config user.name "moyster-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/deals.json data/
          git commit -m "${{ steps.check.outputs.summary }}" -m "Report: data/last-check.md"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          echo "saved=true" >> "$GITHUB_OUTPUT"

      # Commits made by this bot don't trigger other workflows, so redeploy the live site explicitly.
      - name: Redeploy site
        if: steps.save.outputs.saved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
